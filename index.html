    <meta property="og:description" content="Autonomous AI project orchestrator that organizes curated plans, delegates tasks across specialized agents with dynamic roles, manages real-time Kanban boards, allocates resources, generates stakeholder reports, and integrates with Jira and Slack." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Intercept and cleanly suppress WebSocket disconnect errors from @vite/client
        const isWsError = function(err) {
          if (!err) return false;
          const msg = (err.message || err.stack || String(err)).toLowerCase();
          return msg.includes('websocket') || msg.includes('@vite/client') || msg.includes('closed without opened');
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.onunhandledrejection = function(event) {
          if (event && isWsError(event.reason)) {
            event.preventDefault();
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (isWsError(event.error) || isWsError(event.message)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
