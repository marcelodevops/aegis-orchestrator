    <script>
      // Ignore WebSocket errors in AI Studio iframe environment where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason.message === 'string' && event.reason.message.toLowerCase().includes('websocket')) ||
          (typeof event.reason === 'string' && event.reason.toLowerCase().includes('websocket'))
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && typeof event.message === 'string' && event.message.toLowerCase().includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
